task: "extract_gdt"              # unique name you pick
tag: "gd_t"                         # optional tag name
test_split: "train"               # or "test" if your local dataset has splits.
                                    # If your dataset is single-split arrow, it's typically "train".

# dataset_path: "/data2/Users/clark/hadrian_vllm/data/new_hf_datasets/read_gdt_for_id_from_render-single_images-prompt6_claude_try-1-50-multiturn"
dataset_path: "/data2/Users/clark/hadrian_vllm/data/new_hf_datasets/read_gdt_for_id_from_render-single_images-prompt6_claude_try_answers-1-50-singleturn"
#dataset_path: "/data2/Users/clark/hadrian_vllm/data/new_hf_datasets/test-read_gdt_for_id_from_render-single_images-prompt6_claude_try_answers-1-50-singleturn"
dataset_name: null
dataset_kwargs:
  load_from_disk: true
#  token: True
# or if you pushed it to the Hub:
# dataset_path: "username/read_gdt_for_id_from_render-single_images-prompt6_claude_try-1-50-multiturn"

output_type: generate_until         # we want the model to generate text

doc_to_visual: !function utils.gdt_doc_to_visual
doc_to_text: !function utils.gdt_doc_to_text
doc_to_target: !function utils.gdt_doc_to_target

# Additional generation params if using huggingface generation
generation_kwargs:
  max_new_tokens: 2048 # let it think some
  temperature: 0.2
  # top_p: 1.0
  # num_beams: 1
  # do_sample: false

process_results: !function utils.gdt_process_results

metric_list:
  - metric: gdt_correctness
    aggregation: !function utils.gdt_aggregate_results
    higher_is_better: true

metadata:
  version: 0.0
